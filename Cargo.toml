[package]
name = "guoba"
version = "0.1.0"
edition = "2024"


[dependencies]
reqwest = { version = "0.13", features = ["json"] }
http = "1.4.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4"
dirs = "6.0.0"
tray-icon = "0.21.2"
notify-rust = "4.11.7"
async-trait = "0.1.89"
image = "0.25.9"
futures = "0.3.31"
async-channel = "2.5.0"
webbrowser = "1.0.6"
tao = "0.34.5"
strum = { version = "0.27.2", features = ["derive"] }
salvo = { version = "0.89.3", features = [
    "serve-static",
    "logging",
    "websocket",
] }
tokio = { version = "1.50.0", features = ["macros", "net", "time", "rt"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11.10"
hyper-util = "0.1.20"
hyper = "1.8.1"
# hyperlocal = "0.9.1"
hyperlocal-with-windows = { version = "0.9.0", default-features = false, features = [
    "client",
] }
http-body-util = "0.1.3"
tracing = "0.1.44"
rust-embed = "8.11.0"
rlsp-yaml = "0.6.0"
tower-lsp = "0.20"
tower = "0.5"
yamlpatch = "0.13.0"
yamlpath = "0.34.0"

[target.'cfg(windows)'.dependencies]
zip = "8.5.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1


[features]
local_proxy = []
